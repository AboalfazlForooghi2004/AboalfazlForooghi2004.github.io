<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 155 }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="author" content="{{ site.author }}" />

  <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

  <!-- Open Graph -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 155 }}{% else %}{{ site.description }}{% endif %}" />
  <meta property="og:image" content="{{ site.url }}/assets/images/me-big.png" />
  {% if page.layout == 'post' %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
  <meta property="article:author" content="{{ site.author }}" />
  <meta property="article:section" content="{{ page.category }}" />
  {% endif %}

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="{{ site.url }}{{ page.url }}" />
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 155 }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="twitter:image" content="{{ site.url }}/assets/images/me-big.png" />

  <!-- JSON-LD Person schema (homepage only) -->
  {% if page.layout == 'home' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Abolfazl Foroughi",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/assets/images/me-big.png",
    "jobTitle": "Network Engineer",
    "description": "{{ site.description }}",
    "sameAs": [
      "https://github.com/AboalfazlForooghi2004",
      "https://www.linkedin.com/in/abolfazl-foroughi-85119a22a"
    ],
    "knowsAbout": [
      "Network Engineering",
      "Linux Networking",
      "Software-Defined Networking",
      "Network Virtualization",
      "Network Automation"
    ]
  }
  </script>
  {% endif %}

  <!-- JSON-LD BlogPosting schema (article pages only) -->
  {% if page.layout == 'post' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ page.title }}",
    "description": "{{ page.excerpt | strip_html | truncate: 155 }}",
    "image": "{{ site.url }}/assets/images/me-big.png",
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.date | date_to_xmlschema }}",
    "author": {
      "@type": "Person",
      "name": "Abolfazl Foroughi",
      "url": "{{ site.url }}"
    },
    "publisher": {
      "@type": "Person",
      "name": "Abolfazl Foroughi"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ site.url }}{{ page.url }}"
    }
  }
  </script>
  {% endif %}

  <!-- Stylesheet: standard blocking link to prevent FOUC -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  {% include header.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
